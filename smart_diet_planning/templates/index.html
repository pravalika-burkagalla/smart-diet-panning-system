<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Diet Planner - Your Personal Nutrition Guide</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">

        <!-- Header Section -->
        <div class="header">
            <h1>🥗 Smart Diet Planner</h1>
            <p>Your personalized nutrition journey starts here</p>
        </div>

        <!-- Form Section -->
        <form action="/result" method="post">

            <!-- Age -->
            <div class="form-group">
                <label for="age">📅 Age (years)</label>
                <input type="number" id="age" name="age" min="1" max="120" required>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label for="gender">👤 Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select your gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <!-- Height -->
            <div class="form-group">
                <label for="height">📏 Height (centimeters)</label>
                <input type="number" id="height" name="height" min="50" max="250" required>
            </div>

            <!-- Weight -->
            <div class="form-group">
                <label for="weight">⚖️ Weight (kilograms)</label>
                <input type="number" id="weight" name="weight" min="20" max="300" step="0.1" required>
            </div>

            <!-- Activity Level -->
            <div class="form-group">
                <label for="activity">🏃 Activity Level</label>
                <select id="activity" name="activity" required>
                    <option value="">Select your activity level</option>
                    <option value="sedentary">Sedentary (little or no exercise)</option>
                    <option value="light">Light (exercise 1-3 days/week)</option>
                    <option value="moderate">Moderate (exercise 3-5 days/week)</option>
                    <option value="active">Active (exercise 6-7 days/week)</option>
                    <option value="very_active">Very Active (intense daily exercise)</option>
                </select>
            </div>

            <!-- Goal -->
            <div class="form-group">
                <label for="goal">🥗 Your Goal</label>
                <select id="goal" name="goal" required>
                    <option value="">Select your goal</option>
                    <option value="loss">💪 Weight Loss</option>
                    <option value="gain">🍔 Weight Gain</option>
                    <option value="maintain">⚡ Maintain Weight</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit">Generate My Plan →</button>

        </form>
    </div>
</body>
</html>
